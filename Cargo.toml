[workspace]
resolver = "2"
members = ["crates/proto", "crates/hook", "src-tauri"]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/joezhuo2/clawed"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
interprocess = "2.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
