[package]
name = "islet"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "islet"

[lib]
name = "islet_lib"
crate-type = ["rlib"]

[[bin]]
name = "islet"
path = "src/main.rs"

[[bin]]
name = "replay"
path = "src/bin/replay.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
islet-proto = { path = "../crates/proto", features = ["ipc"] }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2.6"
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
interprocess = { workspace = true, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "io-util", "fs"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
dirs = "6"
similar = "2"
log = "0.4"

# TLS for the usage endpoint: rustls with bundled roots on Windows, the system
# TLS stack (Security.framework) and keychain roots on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
ureq = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_Performance",
] }
widestring = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
ureq = { version = "3", default-features = false, features = ["gzip", "native-tls-no-default"] }
tauri-nspanel = "2.1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen", "NSResponder", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray"] }
objc2-io-kit = { version = "0.3", default-features = false, features = ["std", "libc"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFString"] }
