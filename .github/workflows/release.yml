name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      HAS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Check tag matches versions
        run: node scripts/check-version.mjs ${{ github.ref_name }}

      - run: npm run build:hook
      - run: npm run build
      - run: cargo test --workspace
      - run: npm test

      # Optional Authenticode signing. Set WINDOWS_CERTIFICATE (base64 .pfx)
      # and WINDOWS_CERTIFICATE_PASSWORD as repository secrets. Without them
      # the installer is built unsigned.
      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP cert.pfx
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx
          $cfg = @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = "http://timestamp.digicert.com"
          } } }
          $cfg | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 src-tauri/tauri.sign.conf.json
          "SIGN_ARGS=--config src-tauri/tauri.sign.conf.json" >> $env:GITHUB_ENV

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $extra = if ($env:SIGN_ARGS) { $env:SIGN_ARGS -split ' ' } else { @() }
          npx tauri build --bundles nsis @extra

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci

      - name: Check tag matches versions
        run: node scripts/check-version.mjs ${{ github.ref_name }}

      - name: Test (native target only)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          npm run build:hook
          npm run build
          cargo test --workspace

      # Developer ID signing and notarization are done by `tauri build` when
      # the APPLE_* variables are set (see docs/releasing.md). Tauri treats an
      # empty variable as set, so only export the ones that have values.
      # Without a certificate the app is ad-hoc signed ("-"), which Apple
      # silicon requires to run at all; Gatekeeper then needs right-click →
      # Open.
      - name: Signing environment
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ]; then
              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi
          else
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
          fi

      - name: Build app and dmg
        run: npx tauri build --target ${{ matrix.target }} --bundles app,dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Checksums
        working-directory: dist-release
        run: |
          sha256sum *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: node scripts/changelog-section.mjs ${{ github.ref_name }} > NOTES.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --draft \
            --title "clawed ${{ github.ref_name }}" \
            --notes-file NOTES.md \
            dist-release/*.exe dist-release/*.dmg dist-release/SHA256SUMS.txt
