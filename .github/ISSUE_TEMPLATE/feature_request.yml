name: Feature request
description: Suggest an idea or an improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve
      description: What you're trying to do and what gets in the way today.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Sketches or screenshots welcome.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: OS you use islet on
      multiple: true
      options:
        - Windows
        - macOS
    validations:
      required: false
