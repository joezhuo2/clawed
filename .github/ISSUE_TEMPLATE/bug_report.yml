name: Bug report
description: Something in clawed doesn't work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues** (for example an approval applied without your click, or another user reaching the socket) go through [private vulnerability reporting](https://github.com/joezhuo2/clawed/security/advisories/new) instead, see [SECURITY.md](https://github.com/joezhuo2/clawed/blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Claude Code session in ...
        2. Ask it to ...
        3. The island shows ...
    validations:
      required: false

  - type: input
    id: clawed-version
    attributes:
      label: clawed version
      description: "From the installer or dmg file name. Windows: also the Version field in clawed.exe → Properties → Details."
      placeholder: "0.1.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      description: "Windows: run `winver`. macOS: Apple menu → About This Mac."
      placeholder: "Windows 11 24H2 (26100) / macOS 15.6"
    validations:
      required: true

  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
      description: Output of `claude --version`.
      placeholder: "2.1.0 (Claude Code)"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Island (pill / expanded view)
        - Approval cards
        - Usage rings
        - Context ring
        - CPU / RAM / GPU meters
        - Tray menu
        - Install / uninstall hooks
        - Settings window
        - Installer / startup / autostart
        - Other
    validations:
      required: false

  - type: textarea
    id: debug
    attributes:
      label: CLAWED_DEBUG output
      description: |
        Quit clawed from the tray first (a second copy just hands off to the running one), then start it with debug output written to a file and reproduce the problem:

        **Windows (PowerShell)**, default per-user install:
        ```
        $env:CLAWED_DEBUG = "1"
        Start-Process "$env:LOCALAPPDATA\clawed\clawed.exe" -RedirectStandardError "$HOME\clawed-debug.log"
        ```

        **macOS (Terminal)**:
        ```
        CLAWED_DEBUG=1 /Applications/clawed.app/Contents/MacOS/clawed 2> ~/clawed-debug.log
        ```

        Paste the relevant part below, or attach the file. **The log contains your prompts, file paths and commands; remove anything private before posting.**
      render: text
    validations:
      required: false

  - type: textarea
    id: settings
    attributes:
      label: clawed entries in ~/.claude/settings.json
      description: Only if the problem is about hooks or the status line. Paste the `hooks` and `statusLine` entries that mention clawed-hook, not the whole file.
      render: json
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, other hooks or status line tools you use, multiple monitors or display scaling, terminal or IDE in use.
    validations:
      required: false
